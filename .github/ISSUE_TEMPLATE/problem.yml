name: Something didn't work
description: A helper or setup step did the wrong thing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste real emails, messages, names or personal data.** Describe what happened, or paste output with details replaced."
  - type: dropdown
    id: tool
    attributes:
      label: AI tool
      options: [Claude, ChatGPT, Gemini, Microsoft 365 Copilot, Other]
    validations: { required: true }
  - type: input
    id: plan
    attributes:
      label: Plan (e.g. Free, Pro, Team, work account)
  - type: dropdown
    id: helper
    attributes:
      label: Which part
      options: [build-my-focus-engine (setup), my-smart-assistant, prep-my-meetings, shut-down-my-day, hand-off-my-busywork, Profile]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version (top of your helper or Profile)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
