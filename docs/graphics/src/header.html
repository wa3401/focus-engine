<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>focus-engine · README header</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .frame { width: 1280px; height: 400px; padding: 0 72px; display: grid; grid-template-rows: 1fr auto; }
  .main { align-self: center; padding-top: 18px; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 22px; color: var(--ochre); }
  .tag b { color: var(--muted); font-weight: 400; }
  h1 {
    font-family: "Archivo", sans-serif; font-weight: 800; letter-spacing: -0.04em;
    font-size: 132px; line-height: .92; color: var(--ink); margin: 22px 0 22px -6px;
  }
  .tagline { font-size: 40px; font-weight: 700; letter-spacing: -0.025em; color: var(--ink-2); }
  .tagline span { color: var(--pine); }
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1.5px solid var(--hair); padding: 16px 0 18px;
    font-family: "IBM Plex Mono", monospace; font-size: 18px; color: var(--muted);
  }
  .site { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-2); }
  .site svg { width: 22px; height: 22px; color: var(--ink); transform: translateY(-1px); }
</style>
</head>

  <div class="frame grain">
